# Agentome: `docker compose up -d`, then open http://localhost:3000/setup. Every ${VARIABLE}
# has a default (deploy/CONFIG.md); updates, backups, HTTPS: deploy/OPERATIONS.md. Your own
# changes go into .env or compose.local.yaml, not into this file.
name: agentome

services:
  app:
    # The release: an update or a rollback changes AGENTOME_VERSION. In a checkout,
    # compose.override.yaml builds agentome:local from the source instead.
    image: docker.io/agentome/agentome:${AGENTOME_VERSION:-0.4.4}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The password goes in PGPASSWORD, out of the URL, so any character is fine in it.
      AGENTOME_DATABASE_URL: postgres://agentome@postgres:5432/agentome
      PGPASSWORD: ${AGENTOME_POSTGRES_PASSWORD:-agentome}
      AGENTOME_PUBLIC_URL: ${AGENTOME_PUBLIC_URL:-http://localhost:${AGENTOME_HTTP_PORT:-3000}}
      AGENTOME_LOG_LEVEL: ${AGENTOME_LOG_LEVEL:-}
      AGENTOME_OAUTH_RETURN_URL: ${AGENTOME_OAUTH_RETURN_URL:-}
      # With the places profile: people make their own place on the server from Computers.
      AGENTOME_PLACE_LAUNCHER_URL: ${AGENTOME_PLACE_LAUNCHER_URL:-}
      AGENTOME_PLACE_DISK_GB: ${AGENTOME_PLACE_DISK_GB:-}
      AGENTOME_PLACES_MAX: ${AGENTOME_PLACES_MAX:-}
      AGENTOME_SERVICE_REGISTRIES: ${AGENTOME_SERVICE_REGISTRIES:-}
      # Behind the proxy, the address of the client comes in X-Forwarded-For.
      # Caddy's X-Forwarded-For only, by its service's name: places and seats reach the app
      # directly here, and their header is not taken.
      AGENTOME_TRUST_PROXY: ${AGENTOME_PROXY_HOST:+proxy}
    ports:
      # With the HTTPS proxy, plain HTTP answers this machine only: from elsewhere it could
      # skip the proxy and name any client address in X-Forwarded-For.
      - '${AGENTOME_HTTP_PORT:-${AGENTOME_PROXY_HOST:+127.0.0.1:}3000}:3000'
    volumes:
      # The generated secret key and whatever else the server keeps on disk.
      - agentome-data:/data
    # default: the proxy and the launcher; db: the database, which only the app reaches; seat:
    # the server seat, which reaches the app only; places: people's places on the server, which
    # reach the app and nothing else of ours.
    networks: [default, db, seat, places]
    # Node on port 3000 as an unprivileged user needs no capability.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  # Not published, and on a network of its own with the app: the proxy, the launcher, the seat
  # and the places do not reach it, whatever its password.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentome
      POSTGRES_PASSWORD: ${AGENTOME_POSTGRES_PASSWORD:-agentome}
      POSTGRES_DB: agentome
    volumes:
      - agentome-postgres:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the socket answers already while the temporary server of initdb runs.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U agentome -d agentome']
      interval: 30s
      timeout: 3s
      start_period: 60s
      start_interval: 1s
    networks: [db]
    restart: unless-stopped

  # `docker compose --profile proxy up -d`: HTTPS for the domain in AGENTOME_PROXY_HOST.
  proxy:
    profiles: [proxy]
    image: caddy:2
    depends_on: [app]
    environment:
      AGENTOME_PROXY_HOST: ${AGENTOME_PROXY_HOST:-}
    # Checked here, because a ${…:?} in this file would stop every compose command.
    command:
      - sh
      - -c
      - >-
        test -n "$$AGENTOME_PROXY_HOST" || { echo 'AGENTOME_PROXY_HOST, the domain, is
        required for the proxy profile' >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's certificates and keys.
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # `docker compose --profile server-seat up -d`: agents that work on the server.
  # Connect it once with a code an admin makes in Admin → Computers:
  #   docker compose run --rm seat connect <code> --server http://app:3000
  # It takes one run and exits; compose starts it again clean. Read-only but for the connection
  # and npm's cache in /seat and the run in memory. Its network has no way out: it reaches the
  # app, and through the egress proxy only the hosts a run's token opens (Agentome, whose model
  # relay holds the key, and the hosts an admin allows on the run's project), not the database.
  # In production, run it on a machine of its own.
  seat:
    profiles: [server-seat]
    image: docker.io/agentome/agentome-seat:${AGENTOME_VERSION:-0.4.4}
    depends_on: [app]
    read_only: true
    # An agent's commands run here: no capability, no way to gain one, and a ceiling on memory
    # (its tmpfs counts against it), processes and CPU, so a run cannot take the host down.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 8g
    pids_limit: 1024
    cpus: 2
    tmpfs:
      - /tmp:mode=1777,size=2g
      # The CLIs' own homes (~/.claude, ~/.codex): in memory too, not under /tmp, where Codex
      # refuses to put its helpers.
      - /home/node:uid=1000,gid=1000,mode=0700,size=512m
      # Claude Code, installed at each start from the image's list of checksums; `exec`, since
      # it is a program.
      - /seat/cli:exec,uid=1000,gid=1000,mode=0700,size=1g
      - /seat/runs:uid=1000,gid=1000,mode=0700,size=4g
    environment:
      # The CLI's calls go out through the proxy with the run's token (apps/worker egressOf).
      AGENTOME_PLACE_EGRESS: place-egress:3128
      NODE_USE_ENV_PROXY: '1'
      # Claude Code's telemetry, error reports and updater call hosts the proxy does not open.
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_AUTOUPDATER: '1'
    volumes:
      - agentome-seat:/seat
    networks: [seat]
    restart: unless-stopped

  # `docker compose --profile places up -d`, with AGENTOME_PLACE_LAUNCHER_URL=http://place-launcher:8080
  # in .env: people make their own place on the server, a container with their subscription in it
  # that runs their agents while they are at work. The launcher is the only service with Docker's
  # socket: it makes places from the seat image with fixed settings, on orders the app signs, and
  # reads the places' key, which the app derives from its own, read-only.
  place-launcher:
    profiles: [places]
    image: docker.io/agentome/agentome:${AGENTOME_VERSION:-0.4.4}
    # The app writes the places' key at its start; the launcher only reads it.
    command: ['agentome', 'place-launcher']
    depends_on:
      app:
        condition: service_healthy
      docker-guard:
        condition: service_started
    volumes:
      # Docker through the guard, which passes only what a launcher does: not Docker's socket.
      - agentome-guard:/run/agentome-guard
      # The places' key alone, which the app writes at its start: not the app's own key, and
      # nothing else of its data.
      - type: volume
        source: agentome-data
        target: /places
        read_only: true
        volume:
          subpath: places
    environment:
      AGENTOME_PLACE_IMAGE: ${AGENTOME_PLACE_IMAGE:-}
      AGENTOME_PLACE_RUNTIME: ${AGENTOME_PLACE_RUNTIME:-}
      AGENTOME_PLACE_DOCKER_RUNTIME: ${AGENTOME_PLACE_DOCKER_RUNTIME:-}
      AGENTOME_PLACES_KEY_FILE: /places/places.key
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    # The image's check asks the app's port; the launcher has its own.
    healthcheck:
      disable: true
    networks: [default]
    restart: unless-stopped

  # The only service with Docker's socket: it passes the launcher's calls and no others, the
  # containers it makes only as a launcher makes them (no privilege, no folder or port of the
  # host), so a launcher broken into is not the host's root. No network at all.
  docker-guard:
    profiles: [places]
    image: docker.io/agentome/agentome:${AGENTOME_VERSION:-0.4.4}
    command: ['agentome', 'docker-guard']
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agentome-guard:/run/agentome-guard
    environment:
      AGENTOME_PLACE_RUNTIME: ${AGENTOME_PLACE_RUNTIME:-}
      AGENTOME_PLACE_DOCKER_RUNTIME: ${AGENTOME_PLACE_DOCKER_RUNTIME:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      disable: true
    network_mode: none
    restart: unless-stopped

  # The places' and the server seat's only way out: their networks have no route outside, and
  # this proxy lets a run reach Agentome, the model vendors, and the hosts an admin opens on the
  # run's project. It asks the app which, by the token each call comes with; it has no key and no
  # socket.
  place-egress:
    profiles: [places, server-seat]
    image: docker.io/agentome/agentome:${AGENTOME_VERSION:-0.4.4}
    command: ['agentome', 'place-egress']
    # The app writes the proxy's key at its start: before that there is no folder to mount.
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    # Its key alone, which the app writes at its start: what the app takes its word by.
    volumes:
      - type: volume
        source: agentome-data
        target: /egress
        read_only: true
        volume:
          subpath: egress
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      disable: true
    # places and seat to take the calls, egress to make them: not the database's network.
    networks: [places, seat, egress]
    restart: unless-stopped

networks:
  default:
  # The database's: the app alone, with no way out.
  db:
    internal: true
  # The server seat's: the app and the egress proxy, no way out.
  seat:
    internal: true
  # The app's and the egress proxy's side of the places, each of which the launcher puts on a
  # network of its own. Named by the project, so that two installations on one host stay apart.
  places:
    # No way out but the egress proxy.
    internal: true
  egress:

volumes:
  agentome-data:
  agentome-seat:
  # The docker guard's socket, which the place launcher alone mounts beside it.
  agentome-guard:
  agentome-postgres:
  caddy-data:
  caddy-config:
