name: e2e

# Playwright for the web app: the smoke runs when a pull request changes apps/web or carries
# the e2e label. Not a required check yet.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# No cancel-in-progress: adding an unrelated label starts a skipped run, which must not
# cancel a smoke that is still running.

jobs:
  e2e:
    name: e2e
    # A label other than e2e does not rerun the suite.
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The checkout is the merge commit, so its first parent is the base branch.
      - name: Decide whether to run
        id: scope
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
        run: |
          if [ "$HAS_LABEL" = true ] || git diff --name-only HEAD^1 HEAD | grep -q '^apps/web/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in apps/web and no e2e label: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @agentome/web exec playwright install --with-deps chromium
      - name: Smoke
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @agentome/web e2e

  web-e2e:
    name: web-e2e
    # The sign-in flow on a clean database: the server applies its migrations on start, and
    # Playwright drives the production build of the web app against it.
    if: github.event.action != 'labeled' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentome
          POSTGRES_PASSWORD: agentome
          POSTGRES_DB: agentome
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether to run
        id: scope
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'e2e') }}
        run: |
          if [ "$HAS_LABEL" = true ] || git diff --name-only HEAD^1 HEAD | grep -qE '^(apps/(web|server)|packages)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in the web app, the server or the packages and no e2e label: skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @agentome/web exec playwright install --with-deps chromium
      - name: Build the web app
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @agentome/web build
      - name: Setup, sign-in, an invitation and an agent from a template
        if: steps.scope.outputs.run == 'true'
        env:
          AGENTOME_E2E_DATABASE_URL: postgres://agentome:agentome@localhost:5432/agentome
        run: pnpm --filter @agentome/web e2e:flow
