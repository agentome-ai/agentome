name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The image for the tag: docker.io/agentome/agentome:X.Y.Z, the tag compose.yaml pins, and
  # :latest, and the same for agentome-seat. The build stage runs natively on amd64 for both platforms (see the Dockerfile),
  # so arm64 costs only its last stage under QEMU.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the tags
        id: tags
        run: |
          image=docker.io/agentome/agentome
          echo "tags=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
          seat=docker.io/agentome/agentome-seat
          echo "seat=$seat:${GITHUB_REF_NAME#v},$seat:latest" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          # A Docker Hub access token of the account that owns the repositories, with Read &
          # Write, kept in this repository's secrets.
          username: agentome
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # What Admin shows as the running version.
          build-args: |
            AGENTOME_BUILD_VERSION=${{ steps.tags.outputs.version }}
            AGENTOME_BUILD_COMMIT=${{ github.sha }}
      # The server seat: the worker with Codex and what installs Claude Code at its start, from
      # the same build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: seat
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.seat }}

  release:
    name: release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Notes are generated from the titles of the merged PRs.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
