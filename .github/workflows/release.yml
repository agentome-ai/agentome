name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Before anything goes out: no secret in the tree, and no critical vulnerability that already
  # has a fix in either image. A critical one without a fix does not stop a release, since nothing
  # could be done about it yet; one that cannot be fixed in time is named, with why and until when,
  # in .trivyignore. The full list of high and critical ones goes to the run's summary either way.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Both by the checksum named above; trivy also by its release's own signature.
      - name: Get the scanners
        run: |
          set -euo pipefail
          trivy=trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          base=https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION
          curl -fsSL -o "$trivy" "$base/$trivy"
          curl -fsSL -o "$trivy.sigstore.json" "$base/$trivy.sigstore.json"
          echo "$TRIVY_SHA256  $trivy" | sha256sum -c -
          cosign verify-blob --bundle "$trivy.sigstore.json" \
            --certificate-identity "https://github.com/aquasecurity/trivy/.github/workflows/reusable-release.yaml@refs/tags/v$TRIVY_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$trivy"
          tar xzf "$trivy" trivy
          gitleaks=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSL -o "$gitleaks" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$gitleaks"
          echo "$GITLEAKS_SHA256  $gitleaks" | sha256sum -c -
          tar xzf "$gitleaks" gitleaks
          mkdir -p "$RUNNER_TEMP/bin" && mv trivy gitleaks "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: No secrets in the tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The images as the next job builds them, for amd64, kept here to scan; the cache passes
      # their layers on, so the build that pushes does not start over.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: agentome-scan:app
          cache-to: type=gha,mode=max,scope=app
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: seat
          load: true
          tags: agentome-scan:seat
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=seat
      - name: No critical vulnerability with a fix
        run: |
          set -euo pipefail
          for image in app seat; do
            {
              echo "### agentome-$image: high and critical"
              echo '```'
              trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --format table "agentome-scan:$image"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          for image in app seat; do
            trivy image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore --exit-code 1 "agentome-scan:$image"
          done

  # The image for the tag: docker.io/agentome/agentome:X.Y.Z, the tag compose.yaml pins, and
  # :latest, and the same for agentome-seat. The build stage runs natively on amd64 for both platforms (see the Dockerfile),
  # so arm64 costs only its last stage under QEMU.
  image:
    name: image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Signing without a key: sigstore's certificate names this workflow and this tag.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the tags
        id: tags
        run: |
          image=docker.io/agentome/agentome
          echo "tags=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
          seat=docker.io/agentome/agentome-seat
          echo "seat=$seat:${GITHUB_REF_NAME#v},$seat:latest" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          # A Docker Hub access token of the account that owns the repositories, with Read &
          # Write, kept in this repository's secrets.
          username: agentome
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: app
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=app
          # What it was built from and what it holds, attached to the image in the registry:
          # `docker buildx imagetools inspect` shows both (OPERATIONS, Checking an image).
          provenance: mode=max
          sbom: true
          # What Admin shows as the running version.
          build-args: |
            AGENTOME_BUILD_VERSION=${{ steps.tags.outputs.version }}
            AGENTOME_BUILD_COMMIT=${{ github.sha }}
      # The server seat: the worker with Codex and what installs Claude Code at its start, from
      # the same build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: seat
        with:
          context: .
          target: seat
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.seat }}
          cache-from: type=gha,scope=seat
          provenance: mode=max
          sbom: true
      # Each image signed by its digest, without a key: an installation checks with
      # `cosign verify` that what it pulls was built here, from this tag (OPERATIONS).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the images
        env:
          APP: docker.io/agentome/agentome@${{ steps.app.outputs.digest }}
          SEAT: docker.io/agentome/agentome-seat@${{ steps.seat.outputs.digest }}
        run: cosign sign --yes "$APP" "$SEAT"

  # The `agentome` program on npm, at the tag's version: `npx agentome install` sets up this very
  # release. After the images, so that what it installs is there.
  npm:
    name: npm
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # npm's provenance: the package page links this workflow run and the commit it built.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Build the program
        run: |
          pnpm install --frozen-lockfile --filter agentome
          cd apps/cli
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          pnpm run build
          cp ../../LICENSE LICENSE
      - name: Publish it
        working-directory: apps/cli
        env:
          # A granular read-write token of the account that owns the package, which may skip
          # 2FA, kept in this repository's secrets. npm stages the version: it goes out once
          # the owner approves it on npmjs.com (Staged Packages), with their 2FA.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

  # The record of Agentome's MCP in the official MCP Registry, which MCP clients and catalogs read:
  # a remote at the person's own server, and the `agentome mcp` of the npm package. After npm, since
  # the registry checks that the package names this server (mcpName). It signs in as this
  # repository through GitHub's OIDC, which proves the io.github.agentome-ai namespace: no secret.
  mcp-registry:
    name: mcp-registry
    needs: npm
    runs-on: ubuntu-latest
    # Most of it is the wait for the npm approval below.
    timeout-minutes: 190
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The publisher of the release named above, checked against the registry's own signature.
      - name: Get mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base=https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION
          curl -fsSL -o "$archive" "$base/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
          tar xzf "$archive" mcp-publisher
      # The registry refuses a version npm does not serve yet, and npm serves it only after
      # the owner approves the staged version: wait for that, up to three hours.
      - name: Wait for npm to serve the version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 180); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/agentome/$version"; then
              echo "npm serves agentome@$version"
              exit 0
            fi
            echo "Waiting for agentome@$version on npm: approve it on npmjs.com, Staged Packages"
            sleep 60
          done
          echo "::error::npm did not serve agentome@$version in three hours. Approve it, then re-run this job."
          exit 1
      - name: Publish the record
        working-directory: apps/cli
        run: |
          node -e '
            const fs = require("node:fs");
            const record = JSON.parse(fs.readFileSync("server.json", "utf8"));
            record.version = record.packages[0].version = process.argv[1];
            fs.writeFileSync("server.json", JSON.stringify(record, null, 2));
          ' "${GITHUB_REF_NAME#v}"
          ../../mcp-publisher login github-oidc
          ../../mcp-publisher publish

  release:
    name: release
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # The checksums are signed without a key, as the images are.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # What an install fetches, with their checksums, signed: agentome.ai serves this same
      # install.sh, which a person can check against SHA256SUMS before running it.
      - name: Sign the install files
        run: |
          set -euo pipefail
          mkdir assets
          cp deploy/install.sh compose.yaml assets/
          (cd assets && sha256sum install.sh compose.yaml > SHA256SUMS)
          cosign sign-blob --yes --bundle assets/SHA256SUMS.sigstore.json assets/SHA256SUMS
      # Notes are generated from the titles of the merged PRs.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          assets/install.sh assets/compose.yaml assets/SHA256SUMS assets/SHA256SUMS.sigstore.json
