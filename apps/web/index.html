<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Installable on a phone's home screen, where pushes arrive. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <!-- The home-screen app's status bar: white with dark text, or black in dark theme,
         set by the script below before the app starts, so it is the page's own colour. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Agentome</title>
    <style>
      /* The phone's splash: the logo while the app loads (src/shell/splash.ts). It is drawn here,
         before any script, and only when the script below marks the page with .splash. */
      #splash {
        display: none;
      }
      .splash #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--bg);
        transition: opacity 200ms ease-out;
      }
      #splash[data-leaving] {
        opacity: 0;
      }
      #splash svg {
        height: 36px;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash #splash {
          transition: none;
        }
      }
    </style>
    <script>
      // Runs before the first paint so a saved theme never flashes the other one.
      // No saved choice means "system": the CSS follows prefers-color-scheme. Key: src/theme.ts.
      // Blocked site data makes localStorage throw: then no saved choice, the OS setting applies.
      {
        const saved = (() => {
          try {
            return localStorage.getItem('agentome-theme');
          } catch {
            return null;
          }
        })();
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        const dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document
            .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
            ?.setAttribute('content', 'black');
        }
        // The splash shows once a tab, on a phone: a reload in the same tab (pull to refresh, a
        // new version) skips it, and so do automated browsers, whose every page would wait on it.
        const opened = (() => {
          try {
            const seen = sessionStorage.getItem('agentome-splash') === 'shown';
            sessionStorage.setItem('agentome-splash', 'shown');
            return !seen;
          } catch {
            return true;
          }
        })();
        if (opened && !navigator.webdriver && window.matchMedia('(max-width: 767.98px)').matches) {
          document.documentElement.classList.add('splash');
        }
      }
    </script>
  </head>
