# The place launcher may make and delete pods and volume claims in the places' namespace, open
# a command in a pod there, and let a place reach its own run; in the cluster, it may only read
# a RuntimeClass, to check that places get gVisor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: place-launcher
  labels:
    app.kubernetes.io/name: place-launcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: place-launcher
  labels:
    app.kubernetes.io/name: place-launcher
rules:
  - apiGroups: ['']
    resources: [pods, persistentvolumeclaims]
    verbs: [get, create, delete]
  # A place's run pods, to remove what a run left when the place sleeps.
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  # Why a pairing failed, in the worker's words.
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  # The terminal in a person's place, and emptying an agent's folders in it.
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [get, create]
  # A run's own policy, which lets its place in: owned by the run's pod, it goes with it.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentome-place-launcher-runtimes
  labels:
    app.kubernetes.io/name: place-launcher
rules:
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentome-place-launcher-runtimes
  labels:
    app.kubernetes.io/name: place-launcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentome-place-launcher-runtimes
subjects:
  - kind: ServiceAccount
    name: place-launcher
    namespace: agentome-places
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: place-launcher
  labels:
    app.kubernetes.io/name: place-launcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: place-launcher
subjects:
  - kind: ServiceAccount
    name: place-launcher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: place-launcher
  labels:
    app.kubernetes.io/name: place-launcher
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: place-launcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: place-launcher
    spec:
      serviceAccountName: place-launcher
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: place-launcher
          image: docker.io/agentome/agentome:0.4.2
          command: ['agentome', 'place-launcher']
          envFrom:
            - configMapRef:
                name: place-launcher
          ports:
            - name: http
              containerPort: 8080
          env:
            # The places' key, derived from the installation's secret key, which the launcher
            # never holds: `agentome places-key` prints it for this Secret (deploy/OPERATIONS.md).
            - name: AGENTOME_PLACES_KEY_FILE
              value: /places/places.key
            # Node trusts the API server's certificate by the service account's CA.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          volumeMounts:
            - name: places-key
              mountPath: /places
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: places-key
          secret:
            secretName: agentome-places
            items:
              - key: places.key
                path: places.key
---
apiVersion: v1
kind: Service
metadata:
  name: place-launcher
  labels:
    app.kubernetes.io/name: place-launcher
spec:
  selector:
    app.kubernetes.io/name: place-launcher
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The app, in its own namespace, by the name places and the proxy call it: `agentome`. If the app
# is in another namespace than `agentome`, put its name here and in the policies below.
apiVersion: v1
kind: Service
metadata:
  name: agentome
  labels:
    app.kubernetes.io/name: agentome
spec:
  type: ExternalName
  externalName: agentome.agentome.svc.cluster.local
---
# The places' only way out: it lets a place reach the server, the model vendors and the hosts an
# admin opens on the run's project, asking the server which by the token each call comes with.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: place-egress
  labels:
    app.kubernetes.io/name: place-egress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: place-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: place-egress
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: place-egress
          image: docker.io/agentome/agentome:0.4.2
          command: ['agentome', 'place-egress']
          # Its key, which the app takes its word by: `agentome egress-key` prints it, from the
          # installation's secret, for the places' Secret (deploy/OPERATIONS.md, Kubernetes).
          env:
            - name: AGENTOME_EGRESS_KEY
              valueFrom:
                secretKeyRef:
                  name: agentome-places
                  key: egress.key
          ports:
            - name: proxy
              containerPort: 3128
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: place-egress
  labels:
    app.kubernetes.io/name: place-egress
spec:
  selector:
    app.kubernetes.io/name: place-egress
  ports:
    - name: proxy
      port: 3128
      targetPort: proxy
---
# Nothing here connects or is connected to unless a policy below says so: a pod the launcher
# made without a place's labels reaches nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# A place makes only these connections: to the server, to the egress proxy, and to its runs'
# CLI containers on 7419. Not to the cluster's DNS, whose forwarding would carry names out; it
# is given the two addresses instead. Not to the database or the launcher. It takes none, but
# for a run's CLI container from its own place: the launcher makes that policy with the run.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentome-places
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentome-place
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentome-place
      ports:
        - port: 7419
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentome
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentome
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: place-egress
      ports:
        - port: 3128
          protocol: TCP
---
# Only the server gives the launcher orders. It calls the cluster's API, whose address no
# policy can name in every cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: place-launcher
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: place-launcher
  policyTypes: [Ingress, Egress]
  egress:
    - {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentome
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agentome
      ports:
        - port: 8080
          protocol: TCP
---
# Only places call out through the proxy, and it calls out anywhere: which host is its own
# list's to say, by the server's answer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: place-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: place-egress
  policyTypes: [Ingress, Egress]
  egress:
    - {}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentome-place
      ports:
        - port: 3128
          protocol: TCP
