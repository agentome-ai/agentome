# The Secret `agentome`: copy this file out of the repository, fill it in and apply it with
# `kubectl apply -f`. kustomization.yaml leaves it out on purpose, so that no password ends
# up in a repository next to the manifests. Its keys are the server's settings by name, and
# you may add other secret ones, such as AGENTOME_KEYCLOAK_CLIENT_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: agentome
  # The namespace of kustomization.yaml.
  namespace: agentome
type: Opaque
stringData:
  # The key the server signs and encrypts its data with: `openssl rand -hex 32`. Keep a copy
  # with your backups: `agentome backup` does not hold it, and without it the database cannot
  # be read. Do not change it later: the server refuses to start with another key.
  AGENTOME_SECRET_KEY: <64 hex characters>
  # Without the password: PostgreSQL inside the cluster is
  #   postgres://agentome@postgres:5432/agentome
  # and a database of the company's own is that of its role, which owns the database.
  AGENTOME_DATABASE_URL: postgres://<user>@<host>:5432/<database>
  # The database password, any characters: `openssl rand -hex 24`. PostgreSQL inside the
  # cluster takes it when it creates its volume. With the password in the URL instead,
  # leave this out.
  PGPASSWORD: <password>
